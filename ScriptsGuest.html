<script>
  const GUEST_STATE = {
    token: '',
    activeTheme: 'elegant_floral',
    guest: null,
    wedding: null,
    wishes: [],
    countdownTimer: null,
    heroSlideTimer: null,
    musicPlaying: false
  };

  function callGuestBackend(action, payload = {}) {
    return new Promise((resolve, reject) => {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((res) => resolve(res))
          .withFailureHandler((err) =>
            reject(new Error(err && err.message ? err.message : 'Gagal memuat data undangan.'))
          )
          .apiDispatcher(action, payload, '');
      } else {
        reject(new Error('Lingkungan Google Apps Script tidak ditemukan.'));
      }
    });
  }

  function escapeGuestHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatFullIndoDate(dateStr) {
    if (!dateStr) return '-';
    try {
      const d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d.getTime())) return String(dateStr);
      return d.toLocaleDateString('id-ID', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
    } catch (e) {
      return String(dateStr);
    }
  }

  function formatShortDate(dateStr) {
    if (!dateStr) return '-';
    try {
      const d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d.getTime())) return String(dateStr);
      return d.toLocaleDateString('id-ID', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
    } catch (e) {
      return String(dateStr);
    }
  }

  function showGuestToast(icon, title) {
    if (typeof Swal === 'undefined') return;
    Swal.fire({
      toast: true,
      position: 'top',
      icon: icon,
      title: title,
      showConfirmButton: false,
      timer: 3000
    });
  }

  function resolveTokenFromUrl() {
    if (
      window.__INITIAL_INVITATION_TOKEN__ &&
      !window.__INITIAL_INVITATION_TOKEN__.includes('initialToken')
    ) {
      return window.__INITIAL_INVITATION_TOKEN__.trim();
    }
    const params = new URLSearchParams(window.location.search);
    return (params.get('token') || '').trim();
  }

  function resolveThemeOverrideFromUrl() {
    try {
      const params = new URLSearchParams(window.location.search);
      return (params.get('theme') || '').trim().toLowerCase();
    } catch (e) {
      return '';
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      if (typeof lucide !== 'undefined' && lucide.createIcons) {
        lucide.createIcons();
      }
    } catch (e) {}

    GUEST_STATE.token = resolveTokenFromUrl();
    if (!GUEST_STATE.token) {
      showInvalidInvitationScreen(
        'Token undangan tidak disertakan pada link. Pastikan Anda membuka link undangan pribadi yang lengkap.'
      );
      return;
    }

    try {
      const res = await callGuestBackend('getInvitationByToken', { token: GUEST_STATE.token });
      if (!res || !res.success || !res.data) {
        showInvalidInvitationScreen(
          (res && res.message) || 'Maaf, undangan tidak ditemukan atau link tidak valid.'
        );
        return;
      }

      GUEST_STATE.guest = res.data.guest;
      GUEST_STATE.wedding = res.data.wedding;
      GUEST_STATE.wishes = res.data.wishes || [];

      populateInvitationContent();
      document.getElementById('guestLoadingScreen').style.display = 'none';
      document.getElementById('openingCoverPage').style.display = 'flex';

      try {
        if (typeof lucide !== 'undefined' && lucide.createIcons) {
          lucide.createIcons();
        }
      } catch (e) {}
    } catch (err) {
      showInvalidInvitationScreen(err.message);
    }
  });

  function showInvalidInvitationScreen(message) {
    document.getElementById('guestLoadingScreen').style.display = 'none';
    document.getElementById('openingCoverPage').style.display = 'none';
    document.getElementById('mainInvitationPage').classList.remove('visible');
    document.getElementById('guestErrorMessage').textContent = message;
    document.getElementById('guestErrorScreen').style.display = 'flex';
    try {
      if (typeof lucide !== 'undefined' && lucide.createIcons) {
        lucide.createIcons();
      }
    } catch (e) {}
  }

  function populateInvitationContent() {
    const g = GUEST_STATE.guest;
    const w = GUEST_STATE.wedding;

    const VALID_THEMES = {
      elegant_floral: true,
      batak_heritage: true,
      modern_minimalist: true,
      romantic_sunset: true,
      dark_luxury: true,
      thelove_cinematic: true,
      dark_boho: true,
      cypress_linen: true,
      first_class_vows: true,
      traditional_java: true
    };
    const urlTheme = resolveThemeOverrideFromUrl();
    const activeTheme = VALID_THEMES[urlTheme]
      ? urlTheme
      : (VALID_THEMES[w.invitation_theme] ? w.invitation_theme : 'elegant_floral');
    GUEST_STATE.activeTheme = activeTheme;

    document.body.setAttribute('data-theme', activeTheme);
    const frameEl = document.querySelector('.mobile-frame');
    if (frameEl) frameEl.setAttribute('data-theme', activeTheme);

    const allThemeMedia = (w.theme_media && typeof w.theme_media === 'object') ? w.theme_media : {};
    const slots = allThemeMedia[activeTheme] || w.active_theme_slots || {};

    const coverUrl = slots.cover_photo || w.cover_image || '';
    const heroUrl = slots.hero_photo || w.hero_image || coverUrl;
    const closingUrl = slots.closing_photo || w.closing_image || heroUrl;
    const groomUrl = slots.groom_photo || w.groom_photo || '';
    const brideUrl = slots.bride_photo || w.bride_photo || '';

    if (coverUrl) {
      const safeCoverCss = `url("${String(coverUrl).replace(/"/g, '')}")`;
      document.body.style.setProperty('--cover-bg-url', safeCoverCss);
      if (frameEl) frameEl.style.setProperty('--cover-bg-url', safeCoverCss);
    }
    if (heroUrl) {
      const safeHeroCss = `url("${String(heroUrl).replace(/"/g, '')}")`;
      document.body.style.setProperty('--hero-bg-url', safeHeroCss);
      if (frameEl) frameEl.style.setProperty('--hero-bg-url', safeHeroCss);
    }
    if (closingUrl) {
      const safeClosingCss = `url("${String(closingUrl).replace(/"/g, '')}")`;
      document.body.style.setProperty('--closing-bg-url', safeClosingCss);
      if (frameEl) frameEl.style.setProperty('--closing-bg-url', safeClosingCss);
      const closingSec = document.getElementById('sec-closing');
      if (closingSec && activeTheme === 'thelove_cinematic') {
        closingSec.style.backgroundImage =
          `linear-gradient(180deg, rgba(27, 27, 24, 0.35) 0%, #1B1B18 94%), ${safeClosingCss}`;
      }
    }

    const gInitial = String(w.groom_nickname || w.groom_name || 'R').trim().charAt(0).toUpperCase();
    const bInitial = String(w.bride_nickname || w.bride_name || 'J').trim().charAt(0).toUpperCase();
    const monogramText = `${gInitial}|${bInitial}`;
    const m1 = document.getElementById('openMinimalistMonogram');
    const m2 = document.getElementById('heroMinimalistMonogram');
    const m3 = document.getElementById('theloveQuoteMonogram');
    if (m1) m1.textContent = monogramText;
    if (m2) m2.textContent = monogramText;
    if (m3) m3.textContent = `${gInitial}&${bInitial} WEDDING`;

    try {
      const dObj = new Date((w.wedding_date || '2026-12-12') + 'T00:00:00');
      if (!isNaN(dObj.getTime())) {
        const monthName = dObj.toLocaleDateString('id-ID', { month: 'long' });
        const dayName = dObj.toLocaleDateString('id-ID', { weekday: 'long' });
        const dayNum = String(dObj.getDate());
        const yearNum = String(dObj.getFullYear());
        ['Akad', 'Rec'].forEach((prefix) => {
          const elM = document.getElementById('split' + prefix + 'Month');
          const elDN = document.getElementById('split' + prefix + 'DayName');
          const elD = document.getElementById('split' + prefix + 'DayNum');
          const elY = document.getElementById('split' + prefix + 'Year');
          if (elM) elM.textContent = monthName;
          if (elDN) elDN.textContent = dayName;
          if (elD) elD.textContent = dayNum;
          if (elY) elY.textContent = yearNum;
        });
      }
    } catch (e) {}

    const coupleShort = `${w.groom_nickname || 'Romeo'} & ${w.bride_nickname || 'Juliet'}`;
    const fullIndoDate = formatFullIndoDate(w.wedding_date);
    const shortIndoDate = formatShortDate(w.wedding_date);

    document.title = `The Wedding of ${coupleShort} — Kepada Yth. ${g.guest_name}`;
    document.getElementById('openCoupleNames').textContent = coupleShort;
    document.getElementById('openGuestName').textContent = g.guest_name;
    document.getElementById('openWeddingDate').textContent = shortIndoDate;
    if (coverUrl) {
      document.getElementById('openCoverPhoto').src = coverUrl;
    }
    if (heroUrl) {
      document.getElementById('mainHeroPhoto').src = heroUrl;
    }

    document.getElementById('mainHeroCoupleTitle').textContent = coupleShort;
    document.getElementById('mainHeroDescription').textContent = w.description || '';

    document.getElementById('mainGroomFullName').textContent = w.groom_name;
    document.getElementById('mainGroomParents').textContent = w.groom_parents || '';
    if (groomUrl) document.getElementById('mainGroomPhoto').src = groomUrl;

    document.getElementById('mainBrideFullName').textContent = w.bride_name;
    document.getElementById('mainBrideParents').textContent = w.bride_parents || '';
    if (brideUrl) document.getElementById('mainBridePhoto').src = brideUrl;

    document.getElementById('mainCountdownDateText').textContent = fullIndoDate;
    startRealtimeCountdown(w.wedding_date);

    if (w.quote_text) {
      document.getElementById('mainQuoteWrapper').style.display = 'block';
      document.getElementById('mainQuoteText').textContent = w.quote_text;
      document.getElementById('mainQuoteSource').textContent = w.quote_source || '';
    } else {
      document.getElementById('mainQuoteWrapper').style.display = 'none';
    }

    document.getElementById('mainAkadTitle').textContent = w.akad_title || 'Akad Nikah';
    document.getElementById('mainAkadDate').textContent = fullIndoDate;
    document.getElementById('mainAkadTime').textContent = `Pukul ${w.akad_time}`;

    document.getElementById('mainReceptionTitle').textContent = w.reception_title || 'Resepsi Pernikahan';
    document.getElementById('mainReceptionDate').textContent = fullIndoDate;
    document.getElementById('mainReceptionTime').textContent = `Pukul ${w.reception_time}`;

    document.getElementById('mainVenueName').textContent = w.venue;
    document.getElementById('mainVenueAddress').textContent = w.address;
    document.getElementById('mainGoogleMapsBtn').href = w.maps_url || 'https:\/\/maps.google.com';

    const storyBox = document.getElementById('mainStoryList');
    const stories = Array.isArray(w.our_story) ? w.our_story : [];
    if (!stories.length) {
      document.getElementById('sec-story').style.display = 'none';
    } else {
      storyBox.innerHTML = stories.map((st, idx) => {
        const storySlotImg = slots['story_' + (idx + 1)] || '';
        const showStoryPhoto = activeTheme === 'thelove_cinematic' && storySlotImg;
        return `
          <div class="story-card reveal-3d" style="${showStoryPhoto ? 'padding:0; overflow:hidden;' : ''}">
            ${showStoryPhoto ? `<img src="${escapeGuestHtml(storySlotImg)}" alt="${escapeGuestHtml(st.title)}" loading="lazy" style="width:100%; height:220px; object-fit:cover; display:block;">` : ''}
            <div style="${showStoryPhoto ? 'padding:16px;' : ''}">
              <div class="story-year">${escapeGuestHtml(st.year)}</div>
              <h4>${escapeGuestHtml(st.title)}</h4>
              <p>${escapeGuestHtml(st.story)}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    const slotGalleryItems = Object.keys(slots)
      .filter((k) => k.indexOf('gallery_') === 0 || k.indexOf('slide_') === 0)
      .sort()
      .map((k, idx) => ({
        image_url: slots[k],
        caption: `Moment ${idx + 1}`
      }))
      .filter((item) => !!item.image_url);

    const galleryList = slotGalleryItems.length
      ? slotGalleryItems
      : (Array.isArray(w.gallery) ? w.gallery : []);

    const galleryGrid = document.getElementById('mainGalleryGrid');
    if (!galleryList.length) {
      document.getElementById('sec-gallery').style.display = 'none';
    } else {
      let filmstripHtml = '';
      if (activeTheme === 'thelove_cinematic' || activeTheme === 'dark_luxury') {
        const doubled = galleryList.concat(galleryList);
        filmstripHtml = `
          <div class="filmstrip-3d-viewport" style="grid-column: 1 / -1; width: 100%; max-width: 100%; min-width: 0; overflow: hidden; margin: 0 auto 10px; border-radius: 8px; box-sizing: border-box;">
            <div class="filmstrip-3d-track">
              ${doubled.map((img) => `
                <img src="${escapeGuestHtml(img.image_url)}" alt="${escapeGuestHtml(img.caption)}" class="filmstrip-3d-item" onclick="openGalleryLightbox('${escapeGuestHtml(img.image_url)}', '${escapeGuestHtml(img.caption)}')">
              `).join('')}
            </div>
          </div>
        `;
      }
      galleryGrid.innerHTML = filmstripHtml + galleryList.map((img, gIdx) => `
        <img
          src="${escapeGuestHtml(img.image_url)}"
          alt="${escapeGuestHtml(img.caption)}"
          class="gallery-thumb reveal-3d"
          style="--card-idx:${gIdx};"
          loading="lazy"
          onclick="openGalleryLightbox('${escapeGuestHtml(img.image_url)}', '${escapeGuestHtml(img.caption)}')"
        >
      `).join('');
    }

    if (activeTheme === 'thelove_cinematic') {
      startTheloveHeroSlideshow([
        heroUrl,
        slots.slide_2 || heroUrl,
        slots.slide_3 || coverUrl
      ].filter(Boolean));
    }

    document.getElementById('rsvpFormGuestName').value = g.guest_name;
    if (g.rsvp) {
      if (g.rsvp.attendance_status === 'Hadir' || g.rsvp.attendance_status === 'Tidak Hadir') {
        document.getElementById('rsvpFormAttendance').value = g.rsvp.attendance_status;
      }
      if (g.rsvp.guest_count > 0) {
        document.getElementById('rsvpFormGuestCount').value = String(Math.min(5, g.rsvp.guest_count));
      }
      document.getElementById('rsvpFormWishes').value = g.rsvp.wishes || '';
      handleRsvpAttendanceChange();
    }

    renderWishesFeed();

    const qrEnabled = w.qr_checkin_enabled !== false;
    const qrSec = document.getElementById('sec-qrcode');
    const qrNavLink = document.querySelector('#bottomTouchNav a[href="#sec-qrcode"]');
    const bottomNav = document.getElementById('bottomTouchNav');

    if (!qrEnabled) {
      if (qrSec) qrSec.style.display = 'none';
      if (qrNavLink) qrNavLink.style.display = 'none';
      if (bottomNav) bottomNav.style.gridTemplateColumns = 'repeat(4, 1fr)';
    } else {
      if (qrSec) qrSec.style.display = '';
      if (qrNavLink) qrNavLink.style.display = '';
      if (bottomNav) bottomNav.style.gridTemplateColumns = 'repeat(5, 1fr)';

      document.getElementById('qrPassGuestName').textContent = g.guest_name;
      document.getElementById('qrPassCategoryBadge').innerHTML =
        `<span style="display:inline-block; padding:4px 12px; border-radius:99px; border:1px solid currentColor; font-size:11.5px; font-weight:600;">Kategori: ${escapeGuestHtml(g.category)}</span>`;

      if (g.checkin && g.checkin.checked_in) {
        document.getElementById('qrPassCheckinStatus').innerHTML =
          `<span style="color:var(--success); font-weight:600;">✓ Sudah Check-in di Lokasi Acara</span>`;
      } else {
        document.getElementById('qrPassCheckinStatus').textContent = 'Status: Siap dipindai saat tiba di lokasi acara';
      }

      const qrContainer = document.getElementById('guestQrCodeContainer');
      qrContainer.innerHTML = '';
      if (typeof QRCode !== 'undefined') {
        new QRCode(qrContainer, {
          text: g.qr_token || GUEST_STATE.token,
          width: 175,
          height: 175,
          colorDark: '#292722',
          colorLight: '#FFFFFF'
        });
      }
    }

    document.getElementById('mainClosingText').textContent = w.closing_text || '';
    document.getElementById('mainClosingCouple').textContent = coupleShort;

    initSmooth3DEngine(activeTheme);
  }

  function startTheloveHeroSlideshow(slideUrls) {
    if (!slideUrls || slideUrls.length < 2) return;
    if (GUEST_STATE.heroSlideTimer) clearInterval(GUEST_STATE.heroSlideTimer);
    let idx = 0;
    const heroSec = document.getElementById('sec-hero');
    if (!heroSec) return;
    GUEST_STATE.heroSlideTimer = setInterval(() => {
      idx = (idx + 1) % slideUrls.length;
      const nextCss = `url("${String(slideUrls[idx]).replace(/"/g, '')}")`;
      heroSec.style.backgroundImage =
        `linear-gradient(180deg, rgba(0, 0, 0, 0.18) 58%, #1B1B18 93%), ${nextCss}`;
    }, 4500);
  }

  function initSmooth3DEngine(activeTheme) {
    if (!document.getElementById('wimsSmooth3DEngineStyles')) {
      const styleEl = document.createElement('style');
      styleEl.id = 'wimsSmooth3DEngineStyles';
      styleEl.textContent = `
        html, body {
          display: block !important;
          width: 100% !important;
          max-width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow-x: hidden !important;
          overscroll-behavior-x: none;
        }
        .mobile-frame {
          display: block !important;
          overflow-x: hidden !important;
          width: 100% !important;
          max-width: 430px;
          margin: 0 auto !important;
          left: 0 !important;
          right: 0 !important;
          box-sizing: border-box !important;
        }
        .opening-cover, .bottom-touch-nav {
          left: 0 !important;
          right: 0 !important;
          margin-left: auto !important;
          margin-right: auto !important;
          width: 100% !important;
          max-width: 430px !important;
          box-sizing: border-box !important;
        }
        @media (max-width: 480px) {
          .mobile-frame, .opening-cover, .bottom-touch-nav {
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 auto !important;
            left: 0 !important;
            right: 0 !important;
          }
        }
        .gallery-grid {
          display: grid !important;
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
          width: 100% !important;
          max-width: 100% !important;
          min-width: 0 !important;
          overflow: hidden !important;
          box-sizing: border-box !important;
        }
        .filmstrip-3d-viewport {
          grid-column: 1 / -1 !important;
          width: 100% !important;
          max-width: 100% !important;
          min-width: 0 !important;
          overflow: hidden !important;
          position: relative !important;
          box-sizing: border-box !important;
        }
        .split-calendar-row, .thelove-split-date {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr) !important;
          width: 100% !important;
          max-width: 280px !important;
          margin-left: auto !important;
          margin-right: auto !important;
        }
        .countdown-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
          width: 100% !important;
          max-width: 100% !important;
          margin-left: auto !important;
          margin-right: auto !important;
        }
        .opening-cover:not(.opened), .bottom-touch-nav {
          transform: none !important;
        }
        .opening-cover {
          will-change: transform, opacity;
          backface-visibility: hidden;
        }
        
        body[data-theme="elegant_floral"] .opening-cover {
          transform-origin: left center;
          transition: transform 1.15s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.9s ease;
        }
        body[data-theme="elegant_floral"] .opening-cover.opened {
          transform: perspective(1500px) rotateY(-108deg) !important;
          opacity: 0;
        }
        
        body[data-theme="batak_heritage"] .opening-cover {
          transform-origin: top center;
          transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.85s ease;
        }
        body[data-theme="batak_heritage"] .opening-cover.opened {
          transform: perspective(1400px) rotateX(78deg) scale(0.92) !important;
          opacity: 0;
        }
        
        body[data-theme="modern_minimalist"] .opening-cover {
          transition: transform 1.05s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
        }
        body[data-theme="modern_minimalist"] .opening-cover.opened {
          transform: perspective(1400px) translate3d(0, -105%, -120px) rotateX(18deg) !important;
          opacity: 0;
        }
        
        body[data-theme="romantic_sunset"] .opening-cover {
          transition: transform 1.15s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.9s ease;
        }
        body[data-theme="romantic_sunset"] .opening-cover.opened {
          transform: perspective(1300px) translate3d(0, -104%, 60px) rotateX(-20deg) !important;
          opacity: 0;
        }
        
        body[data-theme="dark_luxury"] .opening-cover {
          transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.85s ease;
        }
        body[data-theme="dark_luxury"] .opening-cover.opened {
          transform: perspective(1200px) translate3d(0, 0, 260px) scale(1.22) !important;
          opacity: 0;
        }
        
        body[data-theme="thelove_cinematic"] .opening-cover {
          transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.85s ease;
        }
        body[data-theme="thelove_cinematic"] .opening-cover.opened {
          transform: translate3d(0, -102%, 0) scale(1.08) !important;
          opacity: 0;
        }
        body[data-theme="dark_boho"] .opening-cover {
          transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.85s ease;
        }
        body[data-theme="dark_boho"] .opening-cover.opened {
          transform: perspective(1300px) translate3d(0, -104%, -80px) rotateX(12deg) !important;
          opacity: 0;
        }
        body[data-theme="cypress_linen"] .opening-cover {
          transform-origin: left center;
          transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.85s ease;
        }
        body[data-theme="cypress_linen"] .opening-cover.opened {
          transform: perspective(1500px) rotateY(-102deg) !important;
          opacity: 0;
        }
        body[data-theme="first_class_vows"] .opening-cover {
          transition: transform 1.05s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
        }
        body[data-theme="first_class_vows"] .opening-cover.opened {
          transform: perspective(1400px) translate3d(105%, 0, -120px) rotateY(-18deg) !important;
          opacity: 0;
        }
        body[data-theme="traditional_java"] .opening-cover {
          transform-origin: top center;
          transition: transform 1.15s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.85s ease;
        }
        body[data-theme="traditional_java"] .opening-cover.opened {
          transform: perspective(1400px) rotateX(82deg) scale(0.92) !important;
          opacity: 0;
        }
        #sec-hero {
          transition: background-image 1.2s ease-in-out;
        }

        
        .filmstrip-3d-track {
          display: flex;
          gap: 10px;
          width: max-content;
          animation: filmstrip3DScroll 22s linear infinite;
          will-change: transform;
        }
        .filmstrip-3d-item {
          width: 145px;
          height: 185px;
          object-fit: cover;
          border-radius: 8px;
          border: 1px solid rgba(205, 160, 98, 0.45);
          transform: perspective(600px) rotateY(-8deg);
          transition: transform 0.35s ease;
          cursor: pointer;
        }
        .filmstrip-3d-item:hover {
          transform: perspective(600px) rotateY(0deg) scale(1.04);
        }
        @keyframes filmstrip3DScroll {
          0% { transform: translate3d(0, 0, 0); }
          100% { transform: translate3d(-50%, 0, 0); }
        }

        
        .reveal-3d {
          opacity: 0;
          will-change: transform, opacity;
          transition:
            transform 0.85s cubic-bezier(0.22, 1, 0.36, 1),
            opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1);
        }
        body[data-theme="elegant_floral"] .reveal-3d {
          transform: perspective(900px) rotateX(15deg) translate3d(0, 28px, -25px) scale(0.96);
        }
        body[data-theme="batak_heritage"] .reveal-3d {
          transform: perspective(900px) rotateX(18deg) translate3d(0, 28px, -35px) scale(0.95);
        }
        body[data-theme="modern_minimalist"] .reveal-3d {
          transform: perspective(900px) rotateX(10deg) translate3d(0, 22px, -20px) scale(0.97);
        }
        body[data-theme="romantic_sunset"] .reveal-3d {
          transform: perspective(900px) translate3d(0, 32px, -45px) rotateX(16deg) scale(0.95);
        }
        body[data-theme="dark_luxury"] .reveal-3d {
          transform: perspective(900px) rotateX(14deg) scale(0.92) translate3d(0, 24px, -50px);
        }
        body[data-theme="thelove_cinematic"] .reveal-3d {
          transform: perspective(900px) translate3d(0, 24px, -75px) scale(0.89);
        }
        body[data-theme="dark_boho"] .reveal-3d {
          transform: perspective(900px) translate3d(0, 26px, -40px) rotateX(10deg) scale(0.95);
        }
        body[data-theme="cypress_linen"] .reveal-3d {
          transform: perspective(900px) rotateX(14deg) translate3d(0, 26px, -25px) scale(0.96);
        }
        body[data-theme="first_class_vows"] .reveal-3d {
          transform: perspective(900px) translate3d(0, 24px, -30px) scale(0.95);
        }
        body[data-theme="traditional_java"] .reveal-3d {
          transform: perspective(900px) rotateX(16deg) translate3d(0, 28px, -35px) scale(0.95);
        }
        .reveal-3d.in-view-3d {
          opacity: 1 !important;
          transform: perspective(1000px) translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg) scale(1) !important;
        }
      `;
      document.head.appendChild(styleEl);
    }

    const targets = document.querySelectorAll(
      '.floral-card, .gorga-card, .minimal-card, .glass-sunset-card, .luxury-card, ' +
      '.thelove-portrait-card, .thelove-event-card, .couple-card, .event-detail-card, ' +
      '.boho-card-dark, .boho-card-sand, .cd-boho, .cypress-card, .boarding-pass-card, .java-card, ' +
      '.story-card, .gallery-thumb, .cd-pill, .cd-box, .cd-minimal, .cd-sunset, .cd-lux, .cd-thelove, .countdown-box'
    );
    targets.forEach((el) => el.classList.add('reveal-3d'));

    if ('IntersectionObserver' in window) {
      const obs = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('in-view-3d');
            }
          });
        },
        { threshold: 0.12, rootMargin: '0px 0px -24px 0px' }
      );
      document.querySelectorAll('.reveal-3d').forEach((el) => obs.observe(el));
    } else {
      document.querySelectorAll('.reveal-3d').forEach((el) => el.classList.add('in-view-3d'));
    }
  }

  function handleOpenInvitationClick() {
    const coverEl = document.getElementById('openingCoverPage');
    coverEl.classList.add('opened');
    document.getElementById('mainInvitationPage').classList.add('visible');
    document.getElementById('bottomTouchNav').classList.add('visible');

    setTimeout(() => {
      document.querySelectorAll('#sec-hero .reveal-3d').forEach((el) => el.classList.add('in-view-3d'));
    }, 150);

    setTimeout(() => {
      if (coverEl && coverEl.classList.contains('opened')) {
        coverEl.style.display = 'none';
      }
    }, 1050);

    const w = GUEST_STATE.wedding;
    if (w && w.music_enabled && w.music_url) {
      const audio = document.getElementById('bgMusicAudio');
      const musicBtn = document.getElementById('floatingMusicBtn');
      audio.src = w.music_url;
      musicBtn.style.display = 'inline-flex';
      audio.play().then(() => {
        GUEST_STATE.musicPlaying = true;
        musicBtn.classList.add('playing');
      }).catch(() => {
        GUEST_STATE.musicPlaying = false;
      });
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function toggleBackgroundMusic() {
    const audio = document.getElementById('bgMusicAudio');
    const btn = document.getElementById('floatingMusicBtn');
    if (!audio.src) return;

    if (GUEST_STATE.musicPlaying) {
      audio.pause();
      GUEST_STATE.musicPlaying = false;
      btn.classList.remove('playing');
    } else {
      audio.play().then(() => {
        GUEST_STATE.musicPlaying = true;
        btn.classList.add('playing');
      }).catch(() => {});
    }
  }

  function startRealtimeCountdown(weddingDateStr) {
    if (GUEST_STATE.countdownTimer) clearInterval(GUEST_STATE.countdownTimer);
    const targetTime = new Date((weddingDateStr || '2026-12-12') + 'T08:00:00+07:00').getTime();

    const tick = () => {
      const now = Date.now();
      const diff = Math.max(0, targetTime - now);
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('cdDays').textContent = String(days).padStart(2, '0');
      document.getElementById('cdHours').textContent = String(hours).padStart(2, '0');
      document.getElementById('cdMinutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('cdSeconds').textContent = String(seconds).padStart(2, '0');
    };

    tick();
    GUEST_STATE.countdownTimer = setInterval(tick, 1000);
  }

  function openGalleryLightbox(url, caption) {
    document.getElementById('lightboxImgEl').src = url;
    document.getElementById('lightboxCaptionEl').textContent = caption || '';
    document.getElementById('galleryLightbox').classList.add('open');
  }

  function closeGalleryLightbox() {
    document.getElementById('galleryLightbox').classList.remove('open');
  }

  function handleRsvpAttendanceChange() {
    const val = document.getElementById('rsvpFormAttendance').value;
    document.getElementById('rsvpGuestCountWrapper').style.display = val === 'Hadir' ? 'block' : 'none';
  }

  async function handleGuestRsvpSubmit(event) {
    if (event && event.preventDefault) event.preventDefault();
    const attendance_status = document.getElementById('rsvpFormAttendance').value;
    const guest_count = attendance_status === 'Hadir'
      ? parseInt(document.getElementById('rsvpFormGuestCount').value, 10) || 1
      : 0;
    const wishes = document.getElementById('rsvpFormWishes').value.trim();

    if (!wishes || wishes.length < 3) {
      showGuestToast('warning', 'Mohon tuliskan ucapan & doa restu singkat.');
      return;
    }

    const btn = document.getElementById('rsvpSubmitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span>Mengirim Konfirmasi...</span>';

    try {
      const res = await callGuestBackend('submitRSVP', {
        token: GUEST_STATE.token,
        rsvpData: {
          attendance_status,
          guest_count,
          wishes
        }
      });

      if (!res || !res.success) {
        if (typeof Swal !== 'undefined') {
          Swal.fire('Gagal Mengirim RSVP', (res && res.message) || 'Terjadi kesalahan.', 'error');
        }
        return;
      }

      showGuestToast('success', res.message);

      if (res.data && res.data.wishEntry) {
        const newEntry = res.data.wishEntry;
        GUEST_STATE.wishes = GUEST_STATE.wishes.filter(
          (w) => w.sender_name !== newEntry.sender_name
        );
        GUEST_STATE.wishes.unshift(newEntry);
        renderWishesFeed();
      }
    } catch (err) {
      if (typeof Swal !== 'undefined') {
        Swal.fire('Error', err.message, 'error');
      }
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="send" style="width:16px;height:16px;"></i><span>Kirim Konfirmasi &amp; Ucapan</span>';
      try {
        if (typeof lucide !== 'undefined' && lucide.createIcons) {
          lucide.createIcons();
        }
      } catch (e) {}
    }
  }

  function renderWishesFeed() {
    const feed = document.getElementById('mainWishesFeed');
    const list = GUEST_STATE.wishes || [];
    document.getElementById('wishesTotalLabel').textContent =
      `${list.length} ucapan dari keluarga dan sahabat`;

    if (!list.length) {
      feed.innerHTML = `
        <div class="wish-item" style="text-align:center; opacity:0.75;">
          Jadilah yang pertama memberikan ucapan dan doa restu untuk kedua mempelai.
        </div>`;
      return;
    }

    feed.innerHTML = list.map((item) => {
      const isHadir = item.attendance_status === 'Hadir';
      return `
        <div class="wish-item">
          <div class="wish-header">
            <span class="wish-sender">${escapeGuestHtml(item.sender_name)}</span>
            <span class="wish-badge ${isHadir ? 'hadir' : 'absen'}">${escapeGuestHtml(item.attendance_status)}</span>
          </div>
          <p style="font-size:13px; line-height:1.55;">"${escapeGuestHtml(item.wishes)}"</p>
        </div>
      `;
    }).join('');
  }
</script>
