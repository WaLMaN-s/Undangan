<script>
  /**
   * Mengisi seluruh slot [data-ornament="..."] dari <template id="ornament-boho-...">
   * agar markup HTML bebas SVG duplikat dan ornamen mudah diganti per tema.
   */
  (function initDarkBohoOrnaments() {
    function mountOrnaments() {
      var slots = document.querySelectorAll('[data-ornament]');
      for (var i = 0; i < slots.length; i++) {
        var slot = slots[i];
        var key = slot.getAttribute('data-ornament');
        if (!key) continue;
        var tpl = document.getElementById('ornament-boho-' + key);
        if (tpl && tpl.content) {
          slot.innerHTML = '';
          slot.appendChild(document.importNode(tpl.content, true));
        }
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', mountOrnaments);
    } else {
      mountOrnaments();
    }
  })();
</script>
